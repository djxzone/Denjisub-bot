<style>
:root{--bg:#050b14;--bg2:#091522;--card:#0c1826;--line:rgba(130,180,210,.16);--tx:#eaf3f8;--mut:#8ca4b4;--ac:#3fd8d4;--ac2:#8aa4ff;--gold:#f0c978;--ink:#032126;--bad:#ef8a98;--ok:#4cd9a0;--r:22px}
:root[data-t=light]{--bg:#f1f6fa;--bg2:#e5eef4;--card:#fff;--line:rgba(20,70,100,.14);--tx:#10222d;--mut:#587182;--ac:#0b9c9a;--ac2:#5b6fe0;--gold:#a8741a;--ink:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;line-height:1.75;padding-bottom:76px;overflow-x:hidden}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.aur{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.aur i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.38;will-change:transform;animation:fl 22s ease-in-out infinite alternate}
.aur i:nth-child(1){background:radial-gradient(circle,var(--ac),transparent 68%);top:-30vmax;inset-inline-start:-20vmax}
.aur i:nth-child(2){background:radial-gradient(circle,var(--ac2),transparent 68%);bottom:-32vmax;inset-inline-end:-22vmax;animation-delay:-8s}
.aur i:nth-child(3){background:radial-gradient(circle,#b46cff,transparent 68%);width:36vmax;height:36vmax;top:35%;inset-inline-start:40%;opacity:.2;animation-delay:-14s}
:root[data-t=light] .aur i{opacity:.2}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
#bar{position:fixed;top:0;inset-inline:0;height:3px;z-index:80;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--gold));transform-origin:right;transform:scaleX(0)}
[dir=ltr] #bar{transform-origin:left}
.wrap{max-width:1160px;margin:auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:70;transition:.3s;border-bottom:1px solid transparent}
header.top.sc{background:color-mix(in srgb,var(--bg) 95%,transparent);border-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;height:64px;direction:rtl}
.sp{margin-inline-end:auto}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 13px;font-size:13px;color:var(--mut);white-space:nowrap;unicode-bidi:plaintext;background:color-mix(in srgb,var(--card) 70%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}.dot.on{background:var(--ok);animation:pu 1.8s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 #4cd9a088}100%{box-shadow:0 0 0 9px #4cd9a000}}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:color-mix(in srgb,var(--card) 70%,transparent)}
.seg button{border:0;background:none;padding:5px 11px;font-size:12px;font-weight:700;color:var(--mut);transition:.25s}
.seg button.on{background:var(--ac);color:var(--ink)}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 70%,transparent);display:grid;place-items:center;transition:.3s}
.ib:hover{transform:rotate(25deg);border-color:var(--ac)}
.menub{width:42px;height:42px;flex:none;border-radius:13px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 85%,transparent);display:grid;place-items:center;color:var(--tx);padding:0}.menub:active{transform:scale(.94)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.mg a{display:flex;flex-direction:column;align-items:center;padding:12px 6px;border:1px solid var(--line);border-radius:16px;text-decoration:none;font-weight:700;font-size:15px;background:color-mix(in srgb,var(--bg2) 70%,transparent)}
.mg a i{font-style:normal;font-size:26px;line-height:1.3}.mg a.on{border-color:var(--ac);color:var(--ac)}
#mdlg{text-align:center}
section{padding:46px 0 6px}
h2.t{margin:0 0 6px;font-size:clamp(26px,4vw,36px);font-weight:800}
h2.t:after{content:"";display:block;width:56px;height:3px;border-radius:9px;margin-top:8px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.sub{color:var(--mut);margin:0 0 18px;font-size:15.5px}
/* hero */
.hero{padding:34px 0 10px;display:grid;gap:30px;align-items:center}
.hl{text-align:center}
.logo{position:relative;width:118px;height:118px;margin:0 auto 18px}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;position:relative;z-index:1;animation:bob 5s ease-in-out infinite;background:var(--bg2)}
.logo:before,.logo:after{content:"";position:absolute;inset:-9px;will-change:transform;border-radius:50%;background:conic-gradient(transparent,var(--ac),var(--ac2),var(--gold),transparent 80%);animation:rot 6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 61%,#000 63%);mask:radial-gradient(circle,transparent 61%,#000 63%)}
.logo:after{filter:blur(14px);opacity:.7}
@keyframes bob{50%{transform:translateY(-6px)}}
.cap{font-size:12.5px;letter-spacing:.42em;color:var(--gold);font-weight:700;margin:0 auto;direction:ltr;width:fit-content;animation:fu .9s both}
.brand{font-family:Cinzel,Georgia,serif;font-weight:800;font-size:clamp(46px,11vw,84px);line-height:1.05;letter-spacing:.06em;margin:8px auto 6px;direction:ltr;white-space:nowrap;width:fit-content}
.brand span{display:inline-block;background:linear-gradient(100deg,#f3eaff 0%,var(--ac) 35%,var(--gold) 55%,#c9b6ff 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:lt .9s cubic-bezier(.2,.8,.2,1) both,sh 6s linear infinite}
@keyframes lt{from{opacity:0;transform:translateY(30px) scale(.8);filter:blur(8px)}}@keyframes sh{to{background-position:-250% 0}}
@keyframes fu{from{opacity:0;transform:translateY(16px)}}
.tag{color:var(--mut);max-width:470px;margin:0 auto;font-size:17px;animation:fu .9s .5s both}
.dv{display:flex;align-items:center;gap:10px;max-width:340px;margin:20px auto;color:var(--gold)}
.dv:before,.dv:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.dv i{width:8px;height:8px;rotate:45deg;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;animation:fu .9s .8s both}
/* buttons */
.btn{position:relative;overflow:hidden;width:100%;margin-top:16px;border:0;border-radius:99px;padding:15px;font-size:19px;font-weight:800;color:var(--ink);background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 10px 28px -12px var(--ac);transition:transform .25s,box-shadow .25s}
.btn:before{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(100deg,transparent,#fff7,transparent);transform:translateX(-160%) skewX(-20deg);animation:sw 3.6s infinite}
@keyframes sw{60%,100%{transform:translateX(320%) skewX(-20deg)}}
.btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 16px 34px -12px var(--ac)}
.btn:active:not(:disabled){transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.o{background:none;color:var(--ac);border:1px solid var(--ac);box-shadow:none;font-size:15px;padding:10px 22px;width:auto;margin:10px 4px 0}.btn.o:before{display:none}
.btn.cta1{width:auto;margin:0;padding:13px 30px;font-size:17px}.btn.cta2{width:auto;margin:0;padding:12px 26px;font-size:16px;background:none;color:var(--tx);border:1px solid var(--line);box-shadow:none}.btn.cta2:before{display:none}
.rp{position:absolute;border-radius:50%;background:#fff6;transform:scale(0);animation:rp .6s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(4);opacity:0}}
/* cards */
.card{position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--card) 88%,#fff 4%),color-mix(in srgb,var(--card) 80%,transparent));box-shadow:inset 0 1px 0 #ffffff12;border:1px solid var(--line);border-radius:var(--r);padding:24px;transition:transform .35s,border-color .35s}
.card.glow:hover{border-color:color-mix(in srgb,var(--ac) 50%,transparent)}
.gb{background:var(--card);overflow:hidden}
.gb:before{content:"";position:absolute;left:50%;top:50%;width:230%;aspect-ratio:1;background:conic-gradient(transparent 0 60%,var(--ac) 82%,var(--ac2) 92%,transparent);transform:translate(-50%,-50%);animation:rotc 6s linear infinite;will-change:transform;pointer-events:none;z-index:0}
.gb:after{content:"";position:absolute;inset:1.6px;border-radius:calc(var(--r) - 1.6px);background:var(--card);pointer-events:none;z-index:0}
.gb>*{position:relative;z-index:1}
@keyframes rotc{to{transform:translate(-50%,-50%) rotate(360deg)}}
.card.glow:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:.3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0),color-mix(in srgb,var(--ac) 20%,transparent),transparent 70%)}
.card.glow:hover:after{opacity:1}
.card h2{margin:0 0 4px;font-size:25px;font-weight:800}
.steps{display:flex;margin:6px 0 22px;position:relative}
.steps:before{content:"";position:absolute;top:17px;inset-inline:16.6%;height:2px;background:var(--line)}
.steps i{position:absolute;top:17px;inset-inline-start:16.6%;height:2px;background:var(--ac);width:0;transition:width .7s cubic-bezier(.3,.8,.3,1);box-shadow:0 0 10px var(--ac)}
.st{flex:1;text-align:center;font-size:13px;color:var(--mut);position:relative;transition:.3s}
.st b{display:grid;place-items:center;width:36px;height:36px;margin:0 auto 4px;border-radius:50%;border:2px solid var(--line);background:var(--bg2);transition:.4s}
.st.on{color:var(--tx)}.st.on b{border-color:var(--ac);color:var(--ac);transform:scale(1.1)}.st.done b{background:var(--ac);border-color:var(--ac);color:var(--ink)}
label{font-weight:700;display:block;margin-bottom:6px;font-size:15px}
.row{display:flex;flex-direction:column;gap:8px}
.nums{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;direction:ltr}
.cw{position:relative}.cw span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:17px;pointer-events:none}.cw input.f{padding-left:28px;letter-spacing:1px}
input.f.bad{border-color:var(--bad)}
.nums input.f{padding-inline:12px}.nums .cw input.f{padding-left:28px}.nums input.f::placeholder{font-size:13px;letter-spacing:0}html[dir=rtl] .nums input.f:placeholder-shown{direction:rtl}
select,input.f{background:color-mix(in srgb,var(--bg2) 80%,transparent);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:17px;transition:.25s;width:100%}
input.f{letter-spacing:2px;direction:ltr;text-align:start}
select:focus,input.f:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.hint{font-size:13.5px;color:var(--mut);margin:8px 0 0}
.lnk{background:none;border:0;color:var(--ac);padding:0;font-weight:700;font-size:14px;text-decoration:underline}
.msg{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:11px 14px;color:var(--mut);font-size:15px;transition:.3s}
.msg.err{border-color:var(--bad);color:var(--bad)}.msg.ok{border-color:var(--ok);color:var(--ok);animation:fu .5s}
#code{display:none;text-align:center;margin-top:18px;padding:18px;border-radius:18px;background:color-mix(in srgb,var(--bg2) 85%,transparent);border:1px dashed var(--ac);position:relative}
#cv{font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:5px;direction:ltr;color:var(--ac);display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
#cv b{display:inline-block;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;text-shadow:0 0 18px var(--ac)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.4)}}
.cd{height:5px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0 4px}.cd i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width 1s linear}
.tipc{display:flex;gap:12px;align-items:center;margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:14.5px;color:var(--mut);background:color-mix(in srgb,var(--card) 60%,transparent);overflow:hidden}
.tipc b{flex:none;background:var(--ac);color:var(--ink);border-radius:99px;padding:1px 12px;font-size:13px}.tipc span{transition:.4s}.tipc span.x{opacity:0;transform:translateY(8px)}.tipc em{margin-inline-start:auto;font-style:normal;font-size:12.5px;direction:ltr}
/* marquee */
.mq{overflow:hidden;border-block:1px solid var(--line);margin-top:34px;direction:ltr;background:color-mix(in srgb,var(--card) 40%,transparent)}
.mq div{display:flex;gap:34px;width:max-content;padding:11px 0;animation:mq 32s linear infinite;font-weight:700;color:var(--mut);font-size:15px}
.mq span:before{content:"◆";color:var(--ac);margin-inline-end:34px;font-size:10px}
@keyframes mq{to{transform:translateX(-50%)}}
/* how */
.how{display:grid;gap:12px;margin-top:16px}
.how>div{display:flex;gap:14px;align-items:flex-start;padding:16px}
.how b{flex:none;width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);display:grid;place-items:center;font-size:17px}
.how h3{margin:0;font-size:17px}.how p{margin:0;color:var(--mut);font-size:14.5px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stats>div{padding:18px 8px;text-align:center}
.stats b{display:block;font-size:clamp(22px,4vw,32px);font-weight:800;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}.stats span{font-size:13px;color:var(--mut)}
.live svg{width:100%;height:84px;display:block}
.live polyline{stroke-dasharray:1000;animation:dr 2s forwards}@keyframes dr{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.mm{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:8px;text-align:center}.mm b{display:block;color:var(--tx);font-size:17px}
/* player */
.pl{display:grid;gap:22px;align-items:center}
.stage{display:flex;justify-content:center;padding:10px 0;position:relative}
.phone{position:relative;width:min(290px,78vw);aspect-ratio:9/19;border-radius:38px;padding:9px;background:linear-gradient(145deg,#2c3c4b,#0d1620);box-shadow:0 30px 70px -20px #000,0 0 0 1px #ffffff14 inset,0 0 60px -10px color-mix(in srgb,var(--ac) 40%,transparent)}
.phone:before{content:"";position:absolute;top:15px;left:50%;width:74px;height:20px;margin-left:-37px;background:#000;border-radius:14px;z-index:9}
.scr{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:#0b141a;color:#e9edef;direction:ltr;font-size:12.5px}
.sc{position:absolute;inset:0;opacity:0;transform:scale(.96);transition:opacity .5s,transform .5s;pointer-events:none}.sc.on{opacity:1;transform:none}
.wb{position:absolute;top:0;left:0;right:0;height:11%;padding:30px 14px 0;background:#1f2c34;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15px}
.wb .dd{font-size:20px;line-height:1;padding:0 4px}
.cr{position:absolute;left:0;right:0;top:12%;display:grid;gap:12px;padding:14px}
.cr div{display:flex;gap:10px;align-items:center}.cr i{width:34px;height:34px;border-radius:50%;background:#26343d}.cr s{flex:1;height:9px;border-radius:9px;background:#26343d;box-shadow:0 14px #1c282f;text-decoration:none}
.menu{position:absolute;right:6%;top:9%;width:58%;background:#233138;border-radius:10px;padding:4px 0;box-shadow:0 12px 30px #000a;opacity:0;transform:scale(.8);transform-origin:top right;transition:.25s}.menu.on{opacity:1;transform:none}
.menu div{height:9.6%;min-height:30px;display:flex;align-items:center;padding:0 14px;font-size:13px;transition:.2s}.menu div.h{background:#3b4a54}
.big2{position:absolute;left:0;right:0;top:20%;text-align:center;font-size:64px;line-height:1}
.t2{position:absolute;left:8%;right:8%;top:42%;text-align:center;color:#9fb0b9;font-size:13px}
.gbtn{position:absolute;left:20%;right:20%;top:58%;height:8%;border-radius:99px;background:#21c063;color:#04200f;font-weight:800;display:grid;place-items:center;transition:.2s}.gbtn.p{transform:scale(.92);background:#1aa354}
.qr{position:absolute;inset:11% 0 0;background:#000;display:grid;place-items:center}
.qf{position:relative;width:58%;aspect-ratio:1;border:2px solid #fff3;border-radius:14px}
.qf:before{content:"";position:absolute;left:6%;right:6%;height:3px;border-radius:9px;background:#25d366;box-shadow:0 0 16px #25d366;animation:scan 2s ease-in-out infinite alternate}@keyframes scan{from{top:8%}to{top:88%}}
.qf b{position:absolute;width:22px;height:22px;border:3px solid #25d366}.qf b:nth-child(1){top:-3px;left:-3px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}.qf b:nth-child(2){top:-3px;right:-3px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}.qf b:nth-child(3){bottom:-3px;left:-3px;border-right:0;border-top:0;border-radius:0 0 0 12px}.qf b:nth-child(4){bottom:-3px;right:-3px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.alt{position:absolute;left:6%;right:6%;top:83%;height:10%;display:grid;place-items:center;text-align:center;color:#25d366;font-weight:700;font-size:13px;border-radius:12px;transition:.25s}.alt.h{background:#25d36625}
.ent{position:absolute;inset:11% 0 0;padding:16px 14px;text-align:center}.ent h4{margin:6px 0 2px;font-size:15px}.ent p{margin:0;color:#9fb0b9;font-size:12px}
.bx{display:flex;justify-content:center;gap:5px;margin:18px 0 0;direction:ltr}.bx s{width:24px;height:34px;border-bottom:2px solid #5b6c75;font-size:19px;font-weight:800;color:#25d366;text-decoration:none;display:grid;place-items:center;transition:.2s}.bx s.f{border-color:#25d366;animation:pop .35s both}.bx u{width:10px}
.kb{position:absolute;left:0;right:0;bottom:0;height:34%;background:#1b262d;padding:8px 6px;display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.kb i{border-radius:5px;background:#2c3b44;transition:.15s}.kb i.h{background:#25d366;transform:scale(1.15)}
.lk{position:absolute;inset:11% 0 0;display:grid;place-items:center;text-align:center}
.spn{width:54px;height:54px;border-radius:50%;border:5px solid #26343d;border-top-color:#25d366;animation:rot .9s linear infinite;margin:0 auto 14px}@keyframes rot{to{transform:rotate(360deg)}}
.okc{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:#25d366;display:grid;place-items:center;animation:pop .6s both}.okc svg{width:46px}.okc path{stroke-dasharray:50;stroke-dashoffset:50;animation:dr2 .6s .3s forwards}@keyframes dr2{to{stroke-dashoffset:0}}
.dvc{margin:14px auto 0;width:84%;display:flex;gap:10px;align-items:center;background:#1f2c34;border-radius:12px;padding:10px 12px;text-align:start;opacity:0;transform:translateY(14px);transition:.5s}.dvc.on{opacity:1;transform:none}.dvc i{font-style:normal;font-size:22px}.dvc b{display:block;font-size:13px}.dvc span{color:#25d366;font-size:11.5px}
.fg{position:absolute;z-index:20;width:24px;height:33px;left:50%;top:90%;transform-origin:1px 1px;filter:drop-shadow(0 3px 5px #000a);transition:left .8s cubic-bezier(.4,.1,.2,1),top .8s cubic-bezier(.4,.1,.2,1),opacity .3s,transform .15s;pointer-events:none}.fg svg{display:block;width:100%;height:100%}
.fg.tap{transform:scale(.82)}.fg:after{content:"";position:absolute;left:-10px;top:-10px;width:22px;height:22px;border-radius:50%;border:3px solid #25d366;opacity:0}.fg.tap:after{animation:rg .5s}@keyframes rg{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(2.4)}}
.cf{position:absolute;z-index:15;width:7px;height:11px;border-radius:2px;left:50%;top:38%;pointer-events:none}

// تحمّل الصورة وتقصّها بدائرة عبر canvas وتحطها كأيقونة. لو الاستضافة ما تسمح بـ CORS يرجع للصورة الأصلية.
// (الأضمن: ضع الصورة بنفس مجلد الموقع باسم favicon.jpg وخلّ CONFIG.FAVICON="favicon.jpg" فما فيه مشكلة CORS أبداً)
let _fvDone="";
function setFavicon(){
 const src=CONFIG.FAVICON;if(!src||_fvDone===src)return;_fvDone=src;
 const put=u=>{$("ico").href=u;$("ico2").href=u};
 put(src);
 const im=new Image();im.crossOrigin="anonymous";
 im.onload=()=>{try{
  const S=192,c=document.createElement("canvas");c.width=c.height=S;const x=c.getContext("2d");
  x.beginPath();x.arc(S/2,S/2,S/2,0,Math.PI*2);x.closePath();x.clip();
  const m=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-m)/2,sy=(im.naturalHeight-m)/2;
  x.drawImage(im,sx,sy,m,m,0,0,S,S);
  const u=c.toDataURL("image/png");
  $("ico").type="image/png";put(u);
 }catch(e){/* canvas ملوّث (CORS) ← نبقي الأصلية */}};
 im.src=src;
}

const SONGS=[
 {n:"الأغنية 1",u:"https://x0.at/mmgB.mp3"},

  if(shuf&&SONGS.length>1){let n;do{n=Math.floor(Math.random()*SONGS.length)}while(n===cur);return load(n,true)}
